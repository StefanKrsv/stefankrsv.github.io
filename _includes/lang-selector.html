<div class="lang-dropdown">
  <select id="langSelect" class="lang-select" aria-label="Select Language">
    {%- for lang in site.languages -%}
      <option
        data-lang="{{ lang }}"
        value="{{ site.baseurl }}{% if lang != site.default_lang %}/{{ lang }}{% endif %}{{ page.url }}"
        {% if lang == site.active_lang %}
          selected="selected"
        {% endif %}
      >
        {% case lang %}
          {% when 'en' -%}
            🇺🇸 English
          {% when 'fr' -%}
            🇫🇷 Français
          {% when 'de' -%}
            🇩🇪 German
          {% else -%}
            {{- lang }}
        {% endcase %}
      </option>
    {%- endfor -%}
  </select>
</div>

<script>
  (() => {
    const select = document.getElementById('langSelect');
    if (!select) return;
    /* The URL is the language choice; preserve shared links and history entries. */
    select.addEventListener('change', () => {
      const target = new URL(select.value, window.location.origin);
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.assign(target.href);
    });
  })();
</script>
