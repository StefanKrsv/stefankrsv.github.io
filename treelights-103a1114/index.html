<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b1a2e">
<title>Tree Lights Installer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 12 34h10L8 54h48L42 34h10z' fill='%2321a35b'/%3E%3Crect x='28' y='54' width='8' height='8' fill='%238a5a2b'/%3E%3Ccircle cx='32' cy='6' r='5' fill='%23ffd166'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/esp-web-tools@10.4.0/dist/web/install-button.js?module"></script>
<style>
:root {
  --night: #0b1a2e;
  --night-2: #12284a;
  --text: #f4f1ea;
  --muted: #b9c3d3;
  --red: #d7263d;
  --red-2: #b81d32;
  --gold: #ffd166;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  color: var(--text);
  background: var(--night);
  font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(120% 80% at 50% 0%, var(--night-2) 0%, var(--night) 60%, #060d18 100%);
}
#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

.garland { position: fixed; top: 0; left: 0; z-index: 1; width: 100%; height: 70px; display: block; }
.garland .wire { fill: none; stroke: #1d3a2a; stroke-width: 2; }
.garland .bulb { animation: twinkle 2.4s ease-in-out infinite; }
.garland .cap { fill: #5b6b62; }
@keyframes twinkle { 0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px currentColor); } 50% { opacity: .45; filter: none; } }

.lang { position: fixed; top: 76px; right: 16px; z-index: 2; display: flex; gap: 4px; }
.lang button {
  font: inherit; font-size: 13px; color: var(--muted); background: transparent;
  border: 1px solid transparent; border-radius: 999px; padding: 2px 10px; cursor: pointer;
}
.lang button[aria-pressed="true"] { color: var(--text); border-color: rgba(255, 255, 255, 0.14); background: rgba(255, 255, 255, 0.07); }

main {
  position: relative; z-index: 1; min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; padding: 110px 16px 48px; text-align: center;
}
h1 {
  font-family: Fraunces, Georgia, serif; font-weight: 700;
  font-size: clamp(36px, 8vw, 56px); line-height: 1.08; margin: 0;
}
esp-web-install-button { display: block; }
esp-web-install-button:not(:defined) [slot="unsupported"],
esp-web-install-button:not(:defined) [slot="not-allowed"] { display: none; }
.btn {
  font: inherit; font-weight: 600; font-size: 17px; cursor: pointer;
  border: 0; border-radius: 999px; padding: 14px 34px; color: #fff;
  background: linear-gradient(180deg, var(--red) 0%, var(--red-2) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 8px 24px rgba(215, 38, 61, 0.4);
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 12px 30px rgba(215, 38, 61, 0.5); }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.slot-msg { display: block; max-width: 360px; font-size: 14px; color: #ffd6dc; background: rgba(215, 38, 61, 0.18); border: 1px solid rgba(215, 38, 61, 0.45); border-radius: 12px; padding: 10px 14px; }
.version { margin: 0; min-height: 1.6em; font-size: 14px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .garland .bulb { animation: none; }
  .btn { transition: none; }
}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<svg class="garland" viewBox="0 0 1200 70" preserveAspectRatio="none" aria-hidden="true" id="garland">
  <path class="wire" d="M0 10 Q 100 50 200 12 T 400 12 T 600 12 T 800 12 T 1000 12 T 1200 10"/>
</svg>

<nav class="lang" aria-label="Language">
  <button type="button" data-lang="en">EN</button>
  <button type="button" data-lang="nl">NL</button>
  <button type="button" data-lang="fr">FR</button>
</nav>

<main>
  <h1>Tree Lights</h1>
  <esp-web-install-button manifest="firmware/manifest.json">
    <button slot="activate" class="btn" type="button" data-i18n="install">Install firmware</button>
    <span slot="unsupported" class="slot-msg" data-i18n="unsupported">Open this page in Google Chrome or Microsoft Edge on a computer.</span>
    <span slot="not-allowed" class="slot-msg" data-i18n="notAllowed">This page must be opened over https.</span>
  </esp-web-install-button>
  <p class="version" id="version" role="status"></p>
</main>

<script>
(function () {
  "use strict";

  var T = {
    en: { install: "Install firmware", unsupported: "Open this page in Google Chrome or Microsoft Edge on a computer.", notAllowed: "This page must be opened over https.", version: "Version", missing: "Firmware not available yet." },
    nl: { install: "Firmware installeren", unsupported: "Open deze pagina in Google Chrome of Microsoft Edge op een computer.", notAllowed: "Deze pagina moet via https geopend worden.", version: "Versie", missing: "Firmware nog niet beschikbaar." },
    fr: { install: "Installer le firmware", unsupported: "Ouvrez cette page dans Google Chrome ou Microsoft Edge sur un ordinateur.", notAllowed: "Cette page doit être ouverte en https.", version: "Version", missing: "Firmware pas encore disponible." }
  };

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  function pickLang() {
    var q = new URLSearchParams(location.search).get("lang");
    if (q && T[q]) return q;
    var saved = store("tl-lang");
    if (saved && T[saved]) return saved;
    var list = navigator.languages || [navigator.language || "en"];
    for (var i = 0; i < list.length; i++) {
      var l = String(list[i]).slice(0, 2).toLowerCase();
      if (T[l]) return l;
    }
    return "en";
  }

  var lang = pickLang();
  var manifest = null;   // null: loading, false: missing
  var vBox = document.getElementById("version");

  function renderVersion() {
    if (manifest === null) { vBox.textContent = ""; return; }
    vBox.textContent = manifest === false ? T[lang].missing : T[lang].version + " " + (manifest.version || "?");
  }

  function apply() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (n) { n.textContent = T[lang][n.getAttribute("data-i18n")]; });
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });
    renderVersion();
  }

  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () { lang = b.getAttribute("data-lang"); store("tl-lang", lang); apply(); });
  });

  fetch("firmware/manifest.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (m) { manifest = m; renderVersion(); })
    .catch(function () {
      manifest = false;
      renderVersion();
      document.querySelectorAll("esp-web-install-button .btn").forEach(function (b) { b.disabled = true; });
    });

  apply();

  // garland bulbs
  (function () {
    var svg = document.getElementById("garland");
    var ns = "http://www.w3.org/2000/svg";
    var colors = ["#ff4d5e", "#ffd166", "#3ddc84", "#4cc9f0", "#ff9f1c", "#c77dff"];
    var wire = svg.querySelector(".wire");
    var len = wire.getTotalLength(), count = 24;
    for (var i = 0; i < count; i++) {
      var p = wire.getPointAtLength((i + 0.5) * len / count);
      var c = colors[i % colors.length];
      var g = document.createElementNS(ns, "g");
      g.setAttribute("class", "bulb");
      g.setAttribute("style", "color:" + c + ";animation-delay:" + (-(i * 0.37) % 2.4).toFixed(2) + "s");
      var cap = document.createElementNS(ns, "rect");
      cap.setAttribute("class", "cap");
      cap.setAttribute("x", (p.x - 3).toFixed(1)); cap.setAttribute("y", p.y.toFixed(1));
      cap.setAttribute("width", "6"); cap.setAttribute("height", "6"); cap.setAttribute("rx", "1");
      var bulb = document.createElementNS(ns, "ellipse");
      bulb.setAttribute("cx", p.x.toFixed(1)); bulb.setAttribute("cy", (p.y + 15).toFixed(1));
      bulb.setAttribute("rx", "6"); bulb.setAttribute("ry", "10"); bulb.setAttribute("fill", c);
      g.appendChild(cap); g.appendChild(bulb); svg.appendChild(g);
    }
  })();

  // snow
  (function () {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var canvas = document.getElementById("snow"), ctx = canvas.getContext("2d");
    var flakes = [], w = 0, h = 0, running = true, last = 0;
    function make(anywhere) {
      var r = Math.random() * 2.4 + 0.6;
      return { x: Math.random() * w, y: anywhere ? Math.random() * h : -5, r: r, vy: 12 + r * 14, sway: Math.random() * Math.PI * 2, a: 0.35 + Math.random() * 0.55 };
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#ffffff";
      for (var i = 0; i < flakes.length; i++) {
        var f = flakes[i];
        ctx.globalAlpha = f.a;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var want = Math.round(Math.min(160, (w * h) / 9000));
      while (flakes.length < want) flakes.push(make(true));
      flakes.length = want;
      if (reduce) draw();
    }
    function step(ts) {
      if (!running) return;
      var dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
      last = ts;
      for (var i = 0; i < flakes.length; i++) {
        var f = flakes[i];
        f.sway += dt * 0.8; f.y += f.vy * dt; f.x += Math.sin(f.sway) * 12 * dt;
        if (f.y > h + 5) flakes[i] = make(false);
        if (f.x > w + 5) f.x = -5; else if (f.x < -5) f.x = w + 5;
      }
      draw();
      requestAnimationFrame(step);
    }
    window.addEventListener("resize", resize);
    resize();
    if (reduce) return;
    document.addEventListener("visibilitychange", function () {
      running = !document.hidden;
      if (running) { last = 0; requestAnimationFrame(step); }
    });
    requestAnimationFrame(step);
  })();
})();
</script>
</body>
</html>
