<style>
:root {
  --bg: #05070b;
  --panel: rgba(255, 255, 255, 0.035);
  --line: rgba(255, 255, 255, 0.09);
  --line-2: rgba(255, 255, 255, 0.16);
  --text: #eef2f6;
  --muted: #8a96a8;
  --dim: #5b6576;
  --accent: #5cf2b0;
  --accent-ink: #03140c;
  --danger: #ff5c6c;
  --warn: #ffcc66;
  --sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100svh;
  background: var(--bg); color: var(--text);
  font: 16px/1.55 var(--sans);
  overflow-x: hidden;
  display: flex; flex-direction: column;
}
/* dot grid, fading out towards the edges */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1.2px);
  background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 30%, transparent 80%);
  mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 30%, transparent 80%);
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(50% 40% at 50% 38%, rgba(92, 242, 176, 0.07), transparent 70%);
}

.top {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px; font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.lang { display: flex; gap: 2px; }
.lang button {
  font: inherit; letter-spacing: inherit; color: var(--dim); background: none; border: 0;
  padding: 6px 8px; border-radius: 6px; cursor: pointer;
}
.lang button:hover { color: var(--text); }
.lang button[aria-pressed="true"] { color: var(--text); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

main {
  position: relative; z-index: 1; flex: 1;
  width: 100%; max-width: 560px; margin: 0 auto; padding: 0 16px 40px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.stage { position: relative; width: 100%; height: min(52vh, 460px); min-height: 280px; transition: height .45s ease, min-height .45s ease; }
main:not([data-state="idle"]) .stage { height: min(30vh, 280px); min-height: 180px; }
#tree { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

h1 { font-weight: 600; font-size: clamp(34px, 7vw, 48px); line-height: 1.05; letter-spacing: -0.03em; margin: 4px 0 10px; }
.meta { font: 400 12.5px/1.4 var(--mono); color: var(--muted); letter-spacing: .04em; margin: 0 0 28px; min-height: 1.4em; }
.meta b { color: var(--text); font-weight: 500; }
.meta .sep { color: var(--dim); margin: 0 8px; }

.panel { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.panel[data-state="idle"], .panel[data-state="connecting"] { min-height: 150px; }
.panel[data-state="ready"], .panel[data-state="busy"], .panel[data-state="done"], .panel[data-state="error"] {
  padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  align-items: stretch; text-align: left;
}
.panel h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.panel p { margin: 0; color: var(--muted); font-size: 15px; }
.panel .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

.btn {
  font: 600 16px/1 var(--sans); letter-spacing: -0.005em; cursor: pointer;
  border: 0; border-radius: 12px; padding: 15px 30px; min-width: 200px;
  color: var(--accent-ink); background: var(--accent);
  box-shadow: 0 0 0 1px rgba(92, 242, 176, 0.5), 0 8px 30px rgba(92, 242, 176, 0.28);
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(92, 242, 176, 0.7), 0 12px 40px rgba(92, 242, 176, 0.4); }
.btn:active { transform: translateY(0); }
.btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.ghost { color: var(--text); background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); min-width: 0; padding: 13px 20px; font-weight: 500; }
.btn.ghost:hover { background: rgba(255, 255, 255, 0.05); }
.btn.small { min-width: 0; padding: 13px 22px; }
.hint { font: 400 12.5px/1.6 var(--mono); color: var(--dim); max-width: 380px; margin: 0; }
.notice { font-size: 15px; color: var(--warn); max-width: 400px; margin: 0; }

.chip { font: 400 12.5px/1.5 var(--mono); color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); flex: none; }

.toggle { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.025); border: 1px solid var(--line); cursor: pointer; }
.toggle input { appearance: none; -webkit-appearance: none; flex: none; margin: 2px 0 0; width: 36px; height: 20px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); position: relative; cursor: pointer; transition: background .15s; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle input:checked { background: var(--danger); }
.toggle input:checked::after { transform: translateX(16px); }
.toggle input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggle b { display: block; font-weight: 500; font-size: 15px; color: var(--text); }
.toggle span span { display: block; font-size: 13.5px; color: var(--muted); }

.progress { height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.progress > div { height: 100%; width: 0; border-radius: inherit; background: var(--accent); box-shadow: 0 0 12px var(--accent); transition: width .25s ease; }
.progress.indeterminate > div { width: 30%; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
.stats { display: flex; justify-content: space-between; font: 400 12.5px/1 var(--mono); color: var(--muted); }
.stats b { color: var(--text); font-weight: 500; }

.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.15); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.ok { width: 22px; height: 22px; flex: none; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14.5px; margin: 2px 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); font-size: 13.5px; color: var(--text); word-break: break-all; }

details.raw { font: 400 12px/1.5 var(--mono); color: var(--dim); }
details.raw summary { cursor: pointer; }
details.raw pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; }

.panel[data-state="error"] h2 { color: var(--danger); }

@media (prefers-reduced-motion: reduce) {
  .stage { transition: none; }
  .btn, .progress > div { transition: none; }
  .progress.indeterminate > div, .spinner { animation-duration: 3s; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i></i><span data-i18n="eyebrow">Firmware installer</span></div>

    <button type="button" data-lang="nl">NL</button>
    <button type="button" data-lang="fr">FR</button>

</header>

<main id="main" data-state="idle">
  <div class="stage"><canvas id="tree" aria-hidden="true"></canvas></div>
  <h1>Tree Lights</h1>
  <p class="meta" id="meta"></p>
  <section class="panel" id="panel" aria-live="polite"></section>
</main>

  function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }

  function pickLang() {
    var q = new URLSearchParams(location.search).get("lang");
    if (q && T[q]) return q;
    var saved = storeGet("tl-lang");
    if (saved && T[saved]) return saved;
    var list = navigator.languages || [navigator.language || "en"];
    for (var i = 0; i < list.length; i++) {
      var l = String(list[i]).slice(0, 2).toLowerCase();
      if (T[l]) return l;
    }
    return "en";
  }
  var lang = pickLang();

  function t(k, vars) {
    var s = (T[lang][k] != null ? T[lang][k] : T.en[k]) || "";

    return s;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  var session = null;         // { port, transport, loader }

  var panel = document.getElementById("panel");

  function setState(next) { S = next; document.getElementById("main").setAttribute("data-state", next.name); render(); tree.setMode(next); }

  function versionLabel() { return manifest && manifest.version ? "v" + manifest.version : ""; }

  function renderMeta() {

    if (manifest === false) { meta.textContent = t("missing"); return; }

    meta.innerHTML = "<b>" + esc(versionLabel()) + "</b><span class=\"sep\">/</span>" + CHIP + (date ? "<span class=\"sep\">/</span>" + esc(date) : "");

  var ICON_OK = '<svg class="ok" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="rgba(92,242,176,.14)" stroke="#5cf2b0" stroke-width="1.5"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#5cf2b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function loadEsptool() { return esptool || (esptool = import(ESPTOOL_URL)); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function rawOf(err) { return err ? String(err.message || err) : ""; }

  async function release(reset) {
    var s = session; session = null;
    if (!s) return;
    try {
      if (reset && s.loader) { await s.transport.setRTS(true); await sleep(100); await s.loader.after(); }
    } catch (e) { /* the board may already be gone */ }
    try { await s.transport.disconnect(); } catch (e) { /* already closed */ }
  }

  async function start() {
    var port;
    try {
      port = await navigator.serial.requestPort();   // must run straight from the click
    } catch (e) {
      return;   // picker closed without choosing a port
    }
    setState({ name: "connecting" });
    var mod;
    try { mod = await loadEsptool(); }
    catch (e) { esptool = null; setState({ name: "error", key: "errDownload", raw: rawOf(e) }); return; }

    var transport = new mod.Transport(port, false);
    var loader = new mod.ESPLoader({ transport: transport, baudrate: 115200, enableTracing: false });
    session = { port: port, transport: transport, loader: loader };
    try {
      await loader.main();
      await loader.flashId();
    } catch (e) {
      var busy = /open|in use|busy/i.test(rawOf(e)) || e.name === "InvalidStateError" || e.name === "NetworkError";
      await release(!busy);
      setState({ name: "error", key: busy ? "errBusy" : "errConnect", raw: rawOf(e) });
      return;
    }
    var chip = loader.chip && loader.chip.CHIP_NAME;
    if (chip !== CHIP) {
      await release(true);
      setState({ name: "error", key: "errChip", chip: chip || "?", raw: "" });
      return;
    }
    var mac = "";
    try { mac = String(await loader.chip.readMac(loader)).toUpperCase(); } catch (e) { mac = ""; }
    setState({ name: "ready", chip: chip, mac: mac, erase: false });
  }

  async function cancel() {
    await release(true);
    setState({ name: "idle" });
  }

  async function install() {
    var loader = session && session.loader;
    if (!loader) { setState({ name: "idle" }); return; }
    var erase = !!S.erase;
    var build = (manifest.builds || []).filter(function (b) { return b.chipFamily === CHIP; })[0];

    setState({ name: "busy", step: "downloading", pct: null });
    var files = [];
    try {
      var base = new URL(MANIFEST_URL, location.href);
      for (var i = 0; i < build.parts.length; i++) {
        var r = await fetch(new URL(build.parts[i].path, base).toString());
        if (!r.ok) throw new Error("HTTP " + r.status + " " + build.parts[i].path);
        files.push({ data: new Uint8Array(await r.arrayBuffer()), address: build.parts[i].offset });
      }
    } catch (e) {
      await release(true);
      setState({ name: "error", key: "errDownload", raw: rawOf(e) });
      return;
    }

    var total = files.reduce(function (n, f) { return n + f.data.length; }, 0);
    try {
      if (erase) {
        setState({ name: "busy", step: "erasing", pct: null });
        await loader.eraseFlash();
      }
      var done = 0;
      setState({ name: "busy", step: "writing", pct: 0, bytes: total, written: 0 });
      await loader.writeFlash({
        fileArray: files, flashSize: "keep", flashMode: "keep", flashFreq: "keep",
        eraseAll: false, compress: true,
        reportProgress: function (idx, written, size) {
          var part = (written / size) * files[idx].data.length;
          if (written === size) { done += part; part = 0; }
          var w = Math.min(total, done + part);
          S = { name: "busy", step: "writing", pct: w / total, bytes: total, written: w };
          updateProgress();
        }
      });
    } catch (e) {
      await release(true);
      setState({ name: "error", key: "errWrite", raw: rawOf(e) });
      return;
    }
    setState({ name: "busy", step: "restarting", pct: 1, bytes: total, written: total });
    await release(true);
    setState({ name: "done" });
  }

  // progress updates arrive often: patch the bar instead of re-rendering the panel
  function updateProgress() {
    tree.setMode(S);
    var bar = panel.querySelector(".progress > div"), stats = panel.querySelector(".stats");
    if (!bar || !stats) { render(); return; }
    var pct = Math.round(S.pct * 100);
    bar.style.width = pct + "%";
    stats.innerHTML = "<span><b>" + Math.round(S.written / 1024) + "</b> / " + Math.round(S.bytes / 1024) + " KB</span><span><b>" + pct + "%</b></span>";
  }

  window.addEventListener("beforeunload", function (e) {
    if (S.name === "busy") { e.preventDefault(); e.returnValue = ""; }
  });

  // ================================================================ 3D LED tree
  var tree = (function () {
    var canvas = document.getElementById("tree"), ctx = canvas.getContext("2d");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var N = 100, leds = [];
    var seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var i = 0; i < N; i++) {
      var f = i / (N - 1);
      var y = Math.pow(f, 0.92);                       // 0 bottom .. 1 top
      var r = (1 - y) * 0.40 + 0.015 + (rnd() - 0.5) * 0.03;
      var a = f * Math.PI * 2 * 8.5 + (rnd() - 0.5) * 0.3;
      leds.push({ x: Math.cos(a) * r, z: Math.sin(a) * r, y: y, tw: rnd() * Math.PI * 2 });
    }
    var w = 0, h = 0, dpr = 1, rot = 0.6, last = 0, t0 = performance.now();
    var mode = { name: "idle" }, modeAt = 0, shown = 0;   // shown: eased progress

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      var rc = canvas.getBoundingClientRect();
      w = rc.width; h = rc.height;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (reduce) frame(performance.now());
    }

    // colours are [hue, saturation, lightness]; brightness travels separately
    function hsl(hh, s, l) { return [((hh % 360) + 360) % 360, s, l]; }
    function hsla(c, a) { return "hsla(" + c[0].toFixed(0) + "," + c[1] + "%," + c[2].toFixed(0) + "%," + a.toFixed(3) + ")"; }

    // colour + brightness of one LED for the current mode
    function shade(p, time) {
      var n = mode.name;
      if (n === "busy") {
        var lit = p.y <= shown + 0.001;
        var edge = Math.max(0, 1 - Math.abs(p.y - shown) * 14);
        if (lit) return [hsl(152 + p.y * 30, 85, 62 + edge * 25), 0.9 + edge * 0.6];
        return [[215, 20, 55], 0.12 + 0.05 * Math.sin(time * 2 + p.tw)];
      }
      if (n === "connecting" || n === "ready") {
        var scan = (Math.sin(time * 1.6) * 0.5 + 0.5) * 1.05 - 0.02;
        var d = Math.abs(p.y - scan);
        var b = Math.max(0, 1 - d * 9);
        return [b > 0.05 ? hsl(152, 85, 55 + b * 25) : [40, 70, 70], 0.18 + b * 1.1];
      }
      if (n === "error") {
        return [[352, 90, 62], 0.35 + 0.3 * (Math.sin(time * 3) * 0.5 + 0.5)];
      }
      if (n === "done") {
        var age = time - modeAt;
        if (age < 5) {
          var ring = Math.max(0, 1 - Math.abs(p.y - ((age * 0.6) % 1.2)) * 6);
          var sp = Math.max(0, Math.sin(time * 9 + p.tw * 7)) * 0.5;
          return [hsl(p.y * 300 + time * 120, 90, 62 + ring * 20), 0.75 + ring + sp];
        }
      }
      // idle: rotate through a few effects, cross-fading
      var cycle = 9, k = (time / cycle) | 0, ph = (time % cycle) / cycle;
      var eff = k % 3;
      var c = idleFx(eff, p, time);
      if (ph > 0.88) {   // blend into the next effect
        var c2 = idleFx((eff + 1) % 3, p, time), m = (ph - 0.88) / 0.12;
        return m < 0.5 ? [c[0], c[1] * (1 - m) + c2[1] * m] : [c2[0], c[1] * (1 - m) + c2[1] * m];
      }
      return c;
    }
    function idleFx(eff, p, time) {
      if (eff === 0) {   // rainbow rise
        return [hsl(p.y * 260 - time * 70, 90, 62), 0.95];
      }
      if (eff === 1) {   // plane sweep through warm white
        var ang = time * 0.9;
        var plane = p.x * Math.cos(ang) + (p.y - 0.5) * 0.6 * Math.sin(ang * 0.7) + p.z * Math.sin(ang);
        var b = Math.max(0, 1 - Math.abs(plane - Math.sin(time * 1.3) * 0.35) * 10);
        return [b > 0.05 ? hsl(165 + b * 40, 90, 58 + b * 18) : [36, 90, 72], 0.35 + b * 1.1];
      }
      // candlelight twinkle
      var fl = Math.sin(time * 3.1 + p.tw * 5) * 0.5 + Math.sin(time * 7.3 + p.tw * 11) * 0.25;
      return [hsl(30 + fl * 8, 95, 60), 0.6 + fl * 0.35];
    }

    function frame(now) {
      var time = (now - t0) / 1000;
      var dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
      last = now;
      if (!reduce) rot += dt * 0.32;
      var target = mode.name === "busy" ? (mode.pct == null ? (mode.step === "restarting" ? 1 : 0) : mode.pct) : mode.name === "done" ? 1 : 0;
      shown += (target - shown) * Math.min(1, dt * 6 || 1);

      ctx.clearRect(0, 0, w, h);
      var H = Math.min(h * 0.8, w * 1.15);
      var cx = w / 2, base = h * 0.9, tilt = 0.16, persp = 2.6;

      // floor rings
      ctx.save();
      ctx.lineWidth = 1;
      for (var k = 0; k < 3; k++) {
        var rr = H * (0.26 + k * 0.12);
        ctx.strokeStyle = "rgba(92,242,176," + (0.14 - k * 0.04) + ")";
        ctx.setLineDash(k === 1 ? [3, 6] : []);
        ctx.beginPath(); ctx.ellipse(cx, base, rr, rr * tilt * 1.6, 0, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();

      var cr = Math.cos(rot), sr = Math.sin(rot), pts = [];
      for (var i = 0; i < N; i++) {
        var p = leds[i];
        var x = p.x * cr - p.z * sr, z = p.x * sr + p.z * cr;
        var s = persp / (persp + z);
        pts.push({ i: i, p: p, sx: cx + x * H * s, sy: base - p.y * H + z * H * tilt, s: s, z: z });
      }

      // the wire, in string order
      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var j = 0; j < N; j++) { if (j) ctx.lineTo(pts[j].sx, pts[j].sy); else ctx.moveTo(pts[j].sx, pts[j].sy); }
      ctx.stroke();

      pts.sort(function (a, b) { return b.z - a.z; });
      ctx.globalCompositeOperation = "lighter";
      for (var q = 0; q < N; q++) {
        var o = pts[q], c = shade(o.p, time), col = c[0], br = Math.max(0, c[1]);
        var depth = 0.55 + 0.45 * (1 - (o.z + 0.45) / 0.9);
        var glowR = (H / 26) * o.s * (0.7 + br * 0.8);
        var a0 = Math.min(1, 0.55 * br * depth);
        var g = ctx.createRadialGradient(o.sx, o.sy, 0, o.sx, o.sy, glowR);
        g.addColorStop(0, hsla(col, a0));
        g.addColorStop(0.18, hsla(col, a0 * 0.45));
        g.addColorStop(0.5, hsla(col, a0 * 0.1));
        g.addColorStop(1, hsla(col, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(o.sx, o.sy, glowR, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = hsla(col, Math.min(1, 0.95 * br * depth));
        ctx.beginPath(); ctx.arc(o.sx, o.sy, Math.max(1.1, (H / 210) * o.s), 0, Math.PI * 2); ctx.fill();
        if (br > 1) {
          ctx.fillStyle = "rgba(255,255,255," + Math.min(1, (br - 1) * 0.8).toFixed(3) + ")";
          ctx.beginPath(); ctx.arc(o.sx, o.sy, Math.max(0.8, (H / 330) * o.s), 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }

    var running = true;
    function loop(now) { if (!running) return; frame(now); requestAnimationFrame(loop); }
    if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas); else window.addEventListener("resize", resize);
    document.addEventListener("visibilitychange", function () {
      running = !document.hidden;
      if (running) { last = 0; requestAnimationFrame(loop); }
    });
    resize();
    if (reduce) {   // still frames, redrawn only when the state changes
      return { setMode: function (m) { if (m.name !== mode.name) modeAt = (performance.now() - t0) / 1000 - 10; mode = m; shown = m.name === "busy" ? (m.pct || 0) : m.name === "done" ? 1 : 0; frame(performance.now()); } };
    }
    requestAnimationFrame(loop);
    return { setMode: function (m) { if (m.name !== mode.name) modeAt = (performance.now() - t0) / 1000; mode = m; } };
  })();

  // ================================================================ boot
  fetch(MANIFEST_URL, { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (m) {
      if (!m || !(m.builds || []).some(function (b) { return b.chipFamily === CHIP; })) throw new Error("no " + CHIP + " build");
      manifest = m;
    })
    .catch(function () { manifest = false; })
    .then(function () { renderMeta(); if (S.name === "idle") render(); });

  applyLang();
  tree.setMode(S);
})();
</script>
</body>
</html>
