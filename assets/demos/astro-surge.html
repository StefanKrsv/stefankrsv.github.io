<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#04050d" />
<title>ASTRO SURGE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #04050d; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
  #scan {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background:
      radial-gradient(120% 90% at 50% 100%, rgba(12,16,44,.4), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px);
  }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 20px 28px; color: #7ef2ff;
  }
  .hud-item { text-align: center; }
  .hud-right { text-align: right; }
  .hk { font-size: 10px; opacity: .45; letter-spacing: .3em; text-transform: uppercase; margin-bottom: 5px; }
  .hv { font-size: 22px; font-weight: 700; text-shadow: 0 0 12px rgba(126,242,255,.55); line-height: 1.2; }
  .lives { color: #ff5c7a; }
  #overlay {
    position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    background: rgba(3,5,15,.8); backdrop-filter: blur(4px); color: #7ef2ff; cursor: pointer;
  }
  #overlay.hidden { display: none; }
  .panel { text-align: center; max-width: 640px; padding: 0 24px; }
  .panel h1 {
    font-size: clamp(42px, 8vw, 84px); line-height: 1.1; letter-spacing: .3em; font-weight: 700;
    color: #fff; text-shadow: 0 0 24px rgba(126,242,255,.6), 0 0 80px rgba(126,242,255,.25);
  }
  .panel h1.red { color: #ff5c7a; text-shadow: 0 0 24px rgba(255,92,122,.6); }
  .sub { margin-top: 22px; font-size: 15px; letter-spacing: .12em; opacity: .8; }
  .hint { margin-top: 12px; font-size: 11px; letter-spacing: .22em; opacity: .5; text-transform: uppercase; }
  .big {
    margin-top: 14px; font-size: 38px; letter-spacing: .12em; color: #ffd65b; font-weight: 700;
    text-shadow: 0 0 18px rgba(255,214,91,.5);
  }
  button {
    margin-top: 28px; padding: 13px 46px; font: inherit; font-weight: 700; font-size: 15px;
    letter-spacing: .28em; color: #7ef2ff; background: rgba(126,242,255,.06);
    border: 2px solid #7ef2ff; border-radius: 8px; cursor: pointer;
    transition: transform .12s, box-shadow .12s, background .12s;
  }
  button:hover { background: rgba(126,242,255,.16); box-shadow: 0 0 26px rgba(126,242,255,.35); transform: scale(1.03); }
  button:active { transform: scale(.98); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="scan"></div>
<div id="hud">
  <div class="hud-item">
    <div class="hk">Score</div>
    <div class="hv" id="score">0</div>
  </div>
  <div class="hud-item">
    <div class="hk">Level</div>
    <div class="hv" id="level">1</div>
  </div>
  <div class="hud-item hud-right">
    <div class="hk">Lives</div>
    <div class="hv lives" id="lives"></div>
    <div class="hv" id="wp" style="font-size:12px;opacity:.65">WP 1</div>
  </div>
</div>
<div id="overlay"></div>
<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const $score = document.getElementById('score');
const $level = document.getElementById('level');
const $lives = document.getElementById('lives');
const $wp = document.getElementById('wp');

const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

let W, H, DPR = 1, bgGrad;
let state = 'menu';
let score = 0, hiScore = 0, level = 1;
let levelTimer = 0, levelFlash = 0, shake = 0;
let animT = 0, lastT = 0, spawnT = 0;
let stars = [], enemies = [], pBullets = [], eBullets = [], particles = [], powerups = [];
let player = null;
let keys = {}, pointerX = null, pointerDown = false;

try { hiScore = +localStorage.getItem('astroHi') || 0; } catch (e) { hiScore = 0; }

// ---------- canvas ----------
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#03040c');
  bgGrad.addColorStop(0.55, '#060919');
  bgGrad.addColorStop(1, '#0b1030');
  for (const s of stars) { if (s.y < 0 || s.y > H) s.y = rnd(0, H); }
}
window.addEventListener('resize', resize);

function initStars() {
  stars = [];
  const tints = ['#ffffff', '#bfe0ff', '#ffd8f0', '#d0f6ff'];
  for (let layer = 0; layer < 3; layer++) {
    for (let i = 0; i < 26 + layer * 18; i++) {
      stars.push({ x: rnd(0, W), y: rnd(0, H), s: rnd(1, 1 + (layer + 1)), v: 26 + (layer + 1) * 46,
        tw: rnd(0, TAU), c: tints[Math.floor(Math.random() * tints.length)] });
    }
  }
}

function updateEnv(dt) {
  animT += dt;
  for (const s of stars) {
    s.y += s.v * dt;
    if (s.y > H) { s.y = -2; s.x = rnd(0, W); }
  }
}

// ---------- game state ----------
function newGame() {
  score = 0; level = 1; levelTimer = 0; levelFlash = 0; shake = 0; spawnT = 1.2;
  enemies = []; pBullets = []; eBullets = []; particles = []; powerups = [];
  player = { x: W / 2, y: H - 105, r: 13, lives: 3, inv: 0, fireCd: 0, power: 1, shield: 0 };
  updateHUD();
}

function showMenu() {
  overlay.innerHTML = `<div class="panel">
    <h1>ASTRO<br>SURGE</h1>
    <p class="sub">NEON ARCADE SHOOTER</p>
    <p class="hint">A / D or &larr;/&rarr; steer &nbsp;·&nbsp; W / S up &amp; down &nbsp;·&nbsp; SPACE fire &nbsp;·&nbsp; P pause</p>
    <p class="hint" style="margin-top:14px">Best &middot; ${hiScore}</p>
    <button onclick="event.preventDefault(); startGame()">LAUNCH</button>
  </div>`;
  overlay.classList.remove('hidden');
}

function startGame() {
  audioCtx();
  newGame();
  state = 'play';
  overlay.classList.add('hidden');
}

function resumeGame() {
  state = 'play';
  overlay.classList.add('hidden');
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    overlay.innerHTML = `<div class="panel"><h1 style="font-size:clamp(30px,6vw,54px)">PAUSED</h1><p class="hint">press P or click to resume</p></div>`;
    overlay.classList.remove('hidden');
  } else if (state === 'pause') {
    resumeGame();
  }
}

function gameOver() {
  state = 'over';
  hiScore = Math.max(hiScore, score);
  try { localStorage.setItem('astroHi', String(hiScore)); } catch (e) { }
  const msg = score >= hiScore && hiScore > 0 ? '\u2605 NEW HIGH SCORE \u2605' : 'BEST \u00b7 ' + hiScore;
  overlay.innerHTML = `<div class="panel"><h1 class="red">GAME OVER</h1><div class="big">${score}</div><p class="sub">${msg}</p><button onclick="event.preventDefault(); startGame()">PLAY AGAIN</button></div>`;
  overlay.classList.remove('hidden');
}

// ---------- audio ----------
let AC = null, noiseBuf = null;
function audioCtx() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type, v, f2) {
  if (!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.03);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + d + 0.15);
}
function boom(big) {
  if (!AC) return;
  const t = AC.currentTime;
  if (!noiseBuf) {
    const n = 4096, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    noiseBuf = b;
  }
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const g = AC.createGain();
  const vol = big ? 0.16 : 0.07;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (big ? 0.45 : 0.2));
  src.connect(g); g.connect(AC.destination);
  src.start(t); src.stop(t + 0.5);
  tone(big ? 170 : 140, big ? 0.5 : 0.22, 'sawtooth', big ? 0.09 : 0.05, 50);
}
function sfxShoot() { tone(950, 0.05, 'square', 0.035); }
function sfxPower() { tone(760, 0.09, 'triangle', 0.05); tone(1240, 0.12, 'triangle', 0.05); }
function sfxShield() { tone(680, 0.18, 'sine', 0.06, 320); }
function sfxLevel() { tone(523, 0.1, 'triangle', 0.05); tone(659, 0.12, 'triangle', 0.05); tone(784, 0.18, 'triangle', 0.06); }

// ---------- entities ----------
function spawnEnemy() {
  const opts = [
    { t: 'grunt', w: 1.2 + level * 0.05 },
    { t: 'zig', w: level > 1 ? 0.9 : 0.15 },
    { t: 'shooter', w: level > 2 ? 1.0 : 0.06 },
    { t: 'tank', w: 0.25 + level * 0.05 },
  ];
  let total = opts.reduce((a, o) => a + o.w, 0), r = rnd(0, total);
  let type = opts[0].t;
  for (const o of opts) { r -= o.w; if (r <= 0) { type = o.t; break; } }
  const e = { type, y: -40, life: 30, shootCd: 0, x: rnd(40, W - 40) };
  const sp = 1 + (level - 1) * 0.05;
  if (type === 'grunt') { e.r = 13; e.hp = 1; e.maxHp = 1; e.vy = 95; e.c = '#ff5c7a'; e.pts = 10; e.dx = rnd(-60, 60); }
  else if (type === 'zig') { e.r = 11; e.hp = 1; e.maxHp = 1; e.vy = 78; e.c = '#6cf7ff'; e.pts = 15; e.baseX = rnd(70, W - 70); e.x = e.baseX; e.amp = rnd(50, 90); e.freq = rnd(0.7, 1.5); e.age = 0; }
  else if (type === 'tank') { e.r = 22; e.hp = 6; e.maxHp = 6; e.vy = 55; e.c = '#ffd65b'; e.pts = 45; }
  else { e.r = 13; e.hp = 2; e.maxHp = 2; e.vy = 68; e.c = '#b26bff'; e.pts = 30; e.shootCd = rnd(1.2, 2.4); }
  e.vy *= sp;
  enemies.push(e);
}

const PCOLORS = { P: '#b26bff', S: '#6cf7ff', H: '#ff6b6b' };
function spawnPowerup(x, y) {
  const types = ['P', 'S', 'H'];
  const type = types[Math.floor(Math.random() * types.length)];
  powerups.push({ type, x: clamp(x, 30, W - 30), y, r: 15, age: 0, c: PCOLORS[type] });
}

function applyPowerup(p) {
  if (p.type === 'P' && player.power < 3) player.power++;
  if (p.type === 'S') player.shield = Math.min(3, player.shield + 1);
  if (p.type === 'H') player.lives = Math.min(5, player.lives + 1);
  sfxPower();
  updateHUD();
}

function fire() {
  const p = player;
  p.fireCd = p.power === 1 ? 0.16 : p.power === 2 ? 0.24 : 0.3;
  const angles = p.power === 1 ? [0]
    : p.power === 2 ? [-0.32, 0, 0.32]
    : [-0.55, -0.33, 0, 0.33, 0.55];
  for (const a of angles) {
    pBullets.push({ x: p.x, y: p.y - 18, vx: Math.sin(a) * 780, vy: -Math.cos(a) * 780, r: 4, t: 2.2,
      dmg: p.power === 3 ? 2 : 1 });
  }
  particles.push({ x: p.x, y: p.y + 14, vx: rnd(-45, 45), vy: rnd(70, 150), c: '#ffd65b', s: 4, life: 0.35, max: 0.35 });
  sfxShoot();
}

function burst(x, y, c, n, spread = 200) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = rnd(spread * 0.25, spread);
    const l = rnd(0.3, 0.85);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rnd(10, 70), c, s: rnd(2, 6), life: l, max: l });
  }
}

function killEnemy(idx) {
  const e = enemies[idx];
  enemies.splice(idx, 1);
  score += e.pts * Math.max(1, level);
  boom(e.type === 'tank');
  burst(e.x, e.y, e.c, e.type === 'tank' ? 34 : 18, e.type === 'tank' ? 280 : 200);
  if (Math.random() < 0.22) spawnPowerup(e.x, e.y);
}

function hitPlayer() {
  if (player.inv > 0) return;
  shake = Math.max(shake, 14);
  if (player.shield > 0) {
    player.shield--;
    burst(player.x, player.y, '#6cf7ff', 20, 150);
    sfxShield();
    updateHUD();
    return;
  }
  player.lives--;
  player.inv = 1.6;
  burst(player.x, player.y, '#7ef2ff', 26, 220);
  boom(false);
  updateHUD();
  if (player.lives <= 0) { gameOver(); return; }
}

// ---------- main loop ----------
function update(dt) {
  updateEnv(dt);
  if (shake > 0) shake = Math.max(0, shake - 45 * dt);
  if (levelFlash > 0) levelFlash -= dt;

  levelTimer += dt;
  if (levelTimer >= 12) {
    levelTimer = 0; level++; levelFlash = 2.2; sfxLevel();
  }
  if (player.inv > 0) player.inv -= dt;
  if (player.lives <= 0) return;

  // controls
  let mv = 0;
  if (keys['a'] || keys['arrowleft']) mv -= 1;
  if (keys['d'] || keys['arrowright']) mv += 1;
  const vy = (keys['w'] || keys['arrowup']) ? -240 : (keys['s'] || keys['arrowdown']) ? 210 : 0;
  player.x += mv * 520 * dt;
  player.y += vy * dt;
  player.x = clamp(player.x, 28, W - 28);
  player.y = clamp(player.y, H * 0.55, H - 66);
  if (pointerDown && pointerX != null) {
    player.x = clamp(player.x + (pointerX - player.x) * Math.min(1, 12 * dt), 28, W - 28);
  }

  // fire
  player.fireCd -= dt;
  if ((keys[' '] || pointerDown) && player.fireCd <= 0) fire();

  // spawn enemies
  spawnT -= dt;
  if (spawnT <= 0) { spawnEnemy(); spawnT = Math.max(0.55, 2.1 - level * 0.08); }

  // player bullets
  for (let i = pBullets.length - 1; i >= 0; i--) {
    const b = pBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.t -= dt;
    if (b.t <= 0 || b.y < -30 || b.y > H + 30 || b.x < -40 || b.x > W + 40) { pBullets.splice(i, 1); continue; }
    for (let j = 0; j < enemies.length; j++) {
      const e = enemies[j];
      const dx = b.x - e.x, dy = b.y - e.y, rr = b.r + e.r;
      if (dx * dx + dy * dy <= rr * rr) {
        pBullets.splice(i, 1);
        e.hp -= b.dmg;
        if (e.hp <= 0) killEnemy(j);
        break;
      }
    }
  }

  // enemies move
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.life -= dt;
    e.y += e.vy * dt;
    if (e.type === 'tank') {
      e.x += clamp((player.x - e.x) / e.r, -0.7, 0.7) * 14 * dt;
    } else if (e.type === 'grunt') {
      e.x += e.dx * dt;
      if (e.x < 30 || e.x > W - 30) e.dx *= -1;
    } else if (e.type === 'zig') {
      e.age += dt;
      e.x = clamp(e.baseX + Math.sin(e.age * e.freq) * e.amp, 30, W - 30);
    }
    if (e.type === 'shooter') {
      e.shootCd -= dt;
      if (e.shootCd <= 0) {
        e.shootCd = rnd(1.0, 1.9);
        const ang = Math.atan2(player.y - e.y, player.x - e.x);
        const a2 = Math.sin(ang) > 0.35 ? ang : Math.PI / 2;
        const sp = 235 + level * 10;
        eBullets.push({ x: e.x, y: e.y + e.r, vx: Math.cos(a2) * sp, vy: Math.sin(a2) * sp, t: 4.5, r: 4 });
      }
    }
    if (e.life <= 0 || e.y > H + 60) enemies.splice(i, 1);
  }

  // enemy bullets
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.t -= dt;
    if (b.t <= 0 || b.y < -30 || b.y > H + 40 || b.x < -30 || b.x > W + 30) { eBullets.splice(i, 1); continue; }
    const dx = b.x - player.x, dy = b.y - player.y;
    if (dx * dx + dy * dy <= (player.r + b.r) * (player.r + b.r)) {
      eBullets.splice(i, 1);
      hitPlayer();
      if (state !== 'play') return;
    }
  }

  // enemy bodies vs player
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const dx = e.x - player.x, dy = e.y - player.y;
    if (player.inv <= 0 && dx * dx + dy * dy <= (e.r + player.r) * (e.r + player.r)) {
      enemies.splice(i, 1);
      burst(e.x, e.y, e.c, e.type === 'tank' ? 26 : 14);
      score += e.pts;
      hitPlayer();
      if (state !== 'play') return;
    }
  }

  // powerups
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += 110 * dt; p.age += dt;
    if (p.y > H + 30) { powerups.splice(i, 1); continue; }
    const dx = p.x - player.x, dy = p.y - player.y;
    if (dx * dx + dy * dy <= (p.r + player.r + 8) * (p.r + player.r + 8)) {
      powerups.splice(i, 1);
      applyPowerup(p);
      burst(p.x, p.y, p.c, 12, 110);
    }
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 130 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function updateHUD() {
  $score.textContent = score;
  $level.textContent = level;
  $lives.textContent = player ? '\u25b2'.repeat(Math.max(0, player.lives)) : '';
  $wp.textContent = player ? 'WP ' + player.power + (player.shield > 0 ? '  \u00b7 SH ' + player.shield : '') : '';
}

// ---------- drawing ----------
function drawStars() {
  for (const s of stars) {
    const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(animT * 1.6 + s.tw));
    ctx.globalAlpha = a;
    ctx.fillStyle = s.c;
    const sz = s.s;
    ctx.fillRect(s.x, s.y, sz, sz);
  }
  ctx.globalAlpha = 1;
}

function drawShip(x, y, firing) {
  if (player && player.inv > 0 && state === 'play' && Math.floor(animT * 18) % 2 === 0) return;
  ctx.save();
  ctx.translate(x, y);
  if (player && player.shield > 0) {
    ctx.strokeStyle = 'rgba(108,247,255,' + (0.3 + 0.15 * Math.sin(animT * 6)) + ')';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 7]);
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.shadowColor = '#7ef2ff'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#8df4ff';
  ctx.beginPath();
  ctx.moveTo(0, -17);
  ctx.lineTo(-13, 13);
  ctx.lineTo(-5, 5);
  ctx.lineTo(5, 5);
  ctx.lineTo(13, 13);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0a1030';
  ctx.beginPath();
  ctx.moveTo(0, -7);
  ctx.lineTo(-4.5, 4);
  ctx.lineTo(4.5, 4);
  ctx.closePath();
  ctx.fill();
  if (firing || player) {
    const fl = 8 + Math.random() * 10;
    ctx.fillStyle = 'rgba(255,190,80,.95)';
    ctx.beginPath();
    ctx.moveTo(-4.5, 13); ctx.lineTo(0, 13 + fl + Math.random() * 7); ctx.lineTo(4.5, 13);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,200,.8)';
    ctx.beginPath();
    ctx.moveTo(-2, 13); ctx.lineTo(0, 13 + fl); ctx.lineTo(2, 13);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawEnemies() {
  ctx.shadowBlur = 0;
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.shadowColor = e.c; ctx.shadowBlur = 12;
    ctx.fillStyle = e.c;
    if (e.type === 'grunt') {
      const r = e.r;
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.15);
      ctx.lineTo(r * 1.15, r * 0.55);
      ctx.lineTo(0, r * 0.2);
      ctx.lineTo(-r * 1.15, r * 0.55);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(0, -r * 0.4, 2.5, 0, TAU); ctx.fill();
    } else if (e.type === 'zig') {
      ctx.rotate(animT * 3);
      const r = e.r;
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.25); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0);
      ctx.closePath(); ctx.fill();
    } else if (e.type === 'tank') {
      const r = e.r;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i * TAU / 6 - TAU / 12;
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0d1026';
      ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffd65b';
      ctx.beginPath(); ctx.arc(0, 0, r * 0.16, 0, TAU); ctx.fill();
    } else {
      const r = e.r;
      ctx.rotate(animT * 2.5);
      const k = r * 0.72;
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.15); ctx.lineTo(k, -k); ctx.lineTo(r * 1.05, 0); ctx.lineTo(k, k);
      ctx.lineTo(0, r * 1.15); ctx.lineTo(-k, k); ctx.lineTo(-r * 1.05, 0); ctx.lineTo(-k, -k);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, TAU); ctx.fill();
    }
    ctx.restore();
    if (e.type === 'tank') {
      const w = e.r * 2.2;
      ctx.fillStyle = 'rgba(12,14,30,.7)';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 13, w, 4);
      ctx.fillStyle = '#ffd65b';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 13, w * (e.hp / e.maxHp), 4);
    }
  }
}

function drawPowerup(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(animT * (2 + (p.type === 'S' ? 2 : 0)));
  const pulse = 1 + 0.12 * Math.sin(animT * 4 + p.age * 10);
  ctx.scale(pulse, pulse);
  ctx.shadowColor = p.c; ctx.shadowBlur = 12;
  ctx.fillStyle = p.c;
  const r = p.r;
  ctx.beginPath();
  ctx.moveTo(0, -r); ctx.lineTo(r * 0.88, r * 0.45); ctx.lineTo(0, r); ctx.lineTo(-r * 0.88, r * 0.45);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#050a1c';
  ctx.font = 'bold 13px ui-monospace, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.type, 0, 1);
  ctx.restore();
}

function drawParticles() {
  ctx.shadowBlur = 0;
  for (const p of particles) {
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    const s = p.s * a;
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}

function drawLevelFlash() {
  ctx.globalAlpha = Math.min(1, levelFlash);
  ctx.shadowColor = '#7ef2ff'; ctx.shadowBlur = 18;
  ctx.fillStyle = '#b9fbff';
  ctx.font = 'bold 40px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('LEVEL ' + level + ' !', W / 2, 84);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  const sx = (Math.random() - 0.5) * shake;
  const sy = (Math.random() - 0.5) * shake;
  ctx.save();
  ctx.translate(sx, sy);

  drawStars();
  if (state === 'menu') {
    drawShip(W / 2, H - 112 + Math.sin(animT * 1.6) * 7, true);
    ctx.restore();
    return;
  }

  for (const p of powerups) drawPowerup(p);
  for (const b of eBullets) {
    ctx.shadowColor = '#ff5c7a'; ctx.shadowBlur = 8; ctx.fillStyle = '#ff809a';
    ctx.fillRect(b.x - 3.5, b.y - 3.5, 7, 7);
  }
  ctx.shadowBlur = 0;
  for (const b of pBullets) {
    ctx.shadowColor = '#7ef2ff'; ctx.shadowBlur = 10; ctx.fillStyle = '#d8fbff';
    ctx.fillRect(b.x - 2.5, b.y - 10, 5, 13);
  }
  ctx.shadowBlur = 0;
  drawEnemies();
  drawParticles();
  if (player && state !== 'over') {
    drawShip(player.x, player.y, (keys[' '] || pointerDown) && player.fireCd < 0.05);
  }
  if (levelFlash > 0) drawLevelFlash();
  ctx.restore();
}

function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  if (state === 'play') update(dt);
  else updateEnv(dt);
  draw();
  requestAnimationFrame(frame);
}

// ---------- input ----------
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ' || k === 'enter' || k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright') e.preventDefault();
  if (state === 'menu' && (k === ' ' || k === 'enter')) startGame();
  else if (state === 'over' && (k === ' ' || k === 'enter' || k === 'r')) startGame();
  else if (state === 'pause' && (k === 'p' || k === 'enter' || k === ' ')) resumeGame();
  else if (state === 'play' && k === 'p') togglePause();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('pointerdown', e => { if (state === 'play') { pointerDown = true; pointerX = e.clientX; } });
window.addEventListener('pointermove', e => { if (pointerDown) pointerX = e.clientX; });
window.addEventListener('pointerup', e => { pointerDown = false; pointerX = null; });
canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

overlay.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (state === 'menu' || state === 'over') startGame();
  else if (state === 'pause') resumeGame();
});

// ---------- boot ----------
resize();
initStars();
showMenu();
updateHUD();
lastT = performance.now();
requestAnimationFrame(frame);
</script>
</body>
</html>
